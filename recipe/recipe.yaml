# The conda recipe for `wf`, built with rattler-build.
#
# One recipe, one builder — there is deliberately no second copy and no second
# workflow. `.github/workflows/package.yml` builds this file on every pull
# request, every push to main, and every `v*` tag, and only the *last* of those
# goes on to publish. A tag therefore cannot discover a packaging problem for
# the first time: it runs the identical steps main has been running all along.
#
# The source is this checkout, not a release tarball, so the recipe can never
# lag the code it packages. A feedstock recipe for prefix.dev/blooop points at
# the tagged tarball instead — see blooop/wayfinder#12.
schema_version: 1

context:
  # Must equal Cargo.toml's version — CI fails the build if they drift.
  version: "0.5.0"

package:
  name: wf
  version: ${{ version }}

source:
  # The checkout itself, one level up from this recipe. `use_gitignore` defaults
  # to true, so `target/` and `output/` never reach the work directory.
  path: ..

build:
  number: 0
  script:
    env:
      # rattler-build runs the build script with a *cleared* environment (strict
      # env isolation, the default) and rewrites even HOME to $SRC_DIR, so
      # CARGO_HOME is not inherited and cargo re-fetches the crates.io index and
      # every crate on each build. This one env entry is the deliberate hole:
      # `package.yml` points it at a restored cache directory. Left empty (the
      # default) the build stays entirely inside the throwaway work directory,
      # which is what makes a local `rattler-build build` hermetic.
      #
      # Deliberately *only* the registry, never CARGO_TARGET_DIR. Measured on
      # this recipe: reusing a target dir across builds saves nothing, because
      # $SRC_DIR is a freshly timestamped work path every time and cargo's
      # fingerprints are path-sensitive, so it recompiles from scratch regardless
      # (17.95s "cold" vs 15.73s with both caches warm — the whole gain was the
      # skipped index update) while adding ~160 MB to the CI cache.
      WF_CARGO_HOME: ${{ env.get("WF_CARGO_HOME", default="") }}
    content:
      # `install` and `$PREFIX/bin` are Unix; the `else` fails loudly rather
      # than letting a Windows build quietly produce a package with no binary
      # in it. Adding Windows means adding a `then` here, not deleting this.
      - if: unix
        then:
          # Guarded rather than assigned straight from `env.get`: an *empty*
          # CARGO_HOME is not the same as an unset one, and cargo would take it
          # literally.
          - if [ -n "$WF_CARGO_HOME" ]; then export CARGO_HOME="$WF_CARGO_HOME"; fi
          # --locked: build exactly the committed Cargo.lock, so a package built
          # from a tag is reproducible and no build can silently pick up a newer
          # dep than the one that was tested.
          - cargo build --release --locked --bin wf
          - install -Dm755 target/release/wf "$PREFIX/bin/wf"
        else:
          - echo "wf has no Windows build script yet" >&2 && exit 1

requirements:
  build:
    - rust >=1.75
    # Rust links libgcc_s, so without a C compiler's run_exports the package
    # would ship an undeclared dependency on it (rattler-build says so:
    # "Overlinking against libgcc_s.so.1"). This is what puts `libgcc` in the
    # run requirements, so the only run dep `wf` has is one it genuinely needs.
    - ${{ compiler('c') }}

  # No *declared* run requirements, on purpose — the only one the package has is
  # the `libgcc` that the C compiler's run_exports adds above. `wf` shells out to
  # `gh` and the agent CLI, but it discovers them on PATH, and a missing one
  # degrades to a readable error. That is the same call the sibling `zjsh` recipe
  # makes. Declaring `gh` would clone it into this environment on every machine
  # that already installs it as its own pixi-global tool, and would still not
  # guarantee the agent CLI, which does not come from this channel at all.

tests:
  - script:
      - if: unix
        then:
          # The only thing testable without a tty or `gh` auth: `wf --version`
          # answers on stdout and exits without touching either. That is exactly
          # why the flag exists.
          - wf --version
          - wf --help
  - package_contents:
      bin:
        - wf

about:
  homepage: https://github.com/blooop/wayfinder
  repository: https://github.com/blooop/wayfinder
  license: MIT
  license_file: LICENSE
  summary: A multi-project wayfinder ticket selector over agentic planning maps
  description: |
    `wf` is a fuzzy-find picker over the wayfinder planning maps of every project
    on the machine. Projects accrete as you use it, and each mapped repo's
    tickets are read live from GitHub Issues via `gh`. Pressing enter on a ticket
    runs an agent on it in that project's checkout by replacing `wf`'s own
    process — the picker draws, you pick, and the agent has the terminal.

extra:
  recipe-maintainers:
    - blooop
