# The conda recipe for `wf`, built with rattler-build.
#
# One recipe, one builder — there is deliberately no second copy and no second
# workflow. `.github/workflows/package.yml` builds this file on every pull
# request, every push to main, and every `v*` tag, and only the *last* of those
# goes on to publish. A tag therefore cannot discover a packaging problem for
# the first time: it runs the identical steps main has been running all along.
#
# The source is this checkout, not a release tarball, so the recipe can never
# lag the code it packages. A feedstock recipe for prefix.dev/blooop points at
# the tagged tarball instead — see blooop/wayfinder#12.
schema_version: 1

context:
  # Must equal Cargo.toml's version — CI fails the build if they drift.
  version: "0.20.0"

package:
  name: wf
  version: ${{ version }}

source:
  # The checkout itself, one level up from this recipe. `use_gitignore` defaults
  # to true, so `target/` and `output/` never reach the work directory.
  path: ..

build:
  number: 0
  script:
    env:
      # rattler-build runs the build script with a *cleared* environment (strict
      # env isolation, the default) and rewrites even HOME to $SRC_DIR, so
      # CARGO_HOME is not inherited and cargo re-fetches the crates.io index and
      # every crate on each build. This one env entry is the deliberate hole:
      # `package.yml` points it at a restored cache directory. Left empty (the
      # default) the build stays entirely inside the throwaway work directory,
      # which is what makes a local `rattler-build build` hermetic.
      #
      # Deliberately *only* the registry, never CARGO_TARGET_DIR. Measured on
      # this recipe: reusing a target dir across builds saves nothing, because
      # $SRC_DIR is a freshly timestamped work path every time and cargo's
      # fingerprints are path-sensitive, so it recompiles from scratch regardless
      # (17.95s "cold" vs 15.73s with both caches warm — the whole gain was the
      # skipped index update) while adding ~160 MB to the CI cache.
      WF_CARGO_HOME: ${{ env.get("WF_CARGO_HOME", default="") }}
    content:
      # `install` and `$PREFIX/bin` are Unix; the `else` fails loudly rather
      # than letting a Windows build quietly produce a package with no binary
      # in it. Adding Windows means adding a `then` here, not deleting this.
      - if: unix
        then:
          # Guarded rather than assigned straight from `env.get`: an *empty*
          # CARGO_HOME is not the same as an unset one, and cargo would take it
          # literally.
          - if [ -n "$WF_CARGO_HOME" ]; then export CARGO_HOME="$WF_CARGO_HOME"; fi
          # --locked: build exactly the committed Cargo.lock, so a package built
          # from a tag is reproducible and no build can silently pick up a newer
          # dep than the one that was tested.
          - cargo build --release --locked --bin wf
          - install -Dm755 target/release/wf "$PREFIX/bin/wf"
          # The prompts `wf` execs travel in the same package as the binary
          # that execs them. `wf` hardcodes `/wf-tdd`, `/wf-review`, `/wf` and
          # `/wf-auto` in its routing table, so the skill files are part
          # of its interface — and an interface split across two repos on two
          # release cadences drifts silently, which is exactly what happened
          # before this (blooop/wayfinder#96).
          #
          # `share/wf/skills` relative to `$PREFIX`, which is what
          # `wf skills` reconstructs from its own `current_exe()` — so the
          # binary can find its own prompts without being told where they are.
          - mkdir -p "$PREFIX/share/wf"
          - cp -R skills "$PREFIX/share/wf/skills"
        else:
          - echo "wf has no Windows build script yet" >&2 && exit 1

requirements:
  build:
    # The same pin everything else reads, read rather than repeated. This build
    # resolves `rust` from conda-forge instead of rustup, so it is the one
    # consumer that cannot honour `rust-toolchain.toml` on its own — hence the
    # explicit load, relative to this recipe's own directory.
    #
    # `load_from_file` is experimental, which is what `--experimental` in
    # `package.yml` is for. That coupling cannot rot quietly: without the flag
    # rattler-build refuses to render this file at all and points at this line.
    - rust ==${{ load_from_file("../rust-toolchain.toml").toolchain.channel }}
    # Rust links libgcc_s, so without a C compiler's run_exports the package
    # would ship an undeclared dependency on it (rattler-build says so:
    # "Overlinking against libgcc_s.so.1"). This is what adds `libgcc` to the run
    # requirements below, so the linkage is declared rather than assumed.
    - ${{ compiler('c') }}

  run:
    # The one tool `wf` declares, and the line to read before adding a second.
    #
    # `gh` and the agent CLI are still found on PATH and still undeclared: a
    # missing one degrades to a readable error, and declaring `gh` would clone
    # it into this environment on every machine that already installs it as its
    # own pixi-global tool — the call the sibling `zjsh` recipe makes too.
    #
    # `dl` is declared anyway, because the failure it prevents is a different
    # one. Isolation is not an error path: with no `dl` the launch silently
    # runs on the host instead, so the whole container half of this binary is
    # invisibly absent rather than loudly missing, and the person installing
    # `wf` has no way to know they were meant to install a second thing. The
    # floor is what pairs the two — `dl <workspace> up` (the prewarm) arrived
    # in devlaunch 0.0.24, and `wf` holds the `dl` it finds to that version at
    # runtime as well, so a source build or an older `dl` earlier on PATH
    # degrades with a reason rather than failing mid-launch.
    #
    # It is not free: this pulls python and devpod in, taking `wf` from ~3 MB to
    # ~370 MB on a machine that does not already have devlaunch. Where one does,
    # the duplicate is far cheaper than it looks — pixi hardlinks from its
    # package cache, and measured on this env only 85 MB of 354 MB is copied per
    # environment (the 310 files needing prefix rewriting); the other 269 MB is
    # shared. So the real cost is ~370 MB once per machine and ~85 MB for the
    # second environment that wants it.
    #
    # That is the price of `pixi global install wf` being enough on its own, and
    # it is a runtime coupling that a linked `devlaunch-core` crate
    # (devlaunch#53) would dissolve.
    - devlaunch >=0.0.24

tests:
  - script:
      - if: unix
        then:
          # The only things testable without a tty or `gh` auth: `wf --version`
          # answers on stdout and exits without touching either. That is exactly
          # why the flag exists.
          - wf --version
          - wf --help
          # `wf skills` resolves the bundle from the installed binary's own
          # path, so running it here proves the package really carries the
          # prompts *and* that the binary can find them — the two halves that
          # could each be right while the pair is broken. It reads only; the
          # `install` half writes to $HOME and is not a package concern.
          - wf skills
  - package_contents:
      bin:
        - wf
      files:
        # Named individually rather than as a glob: the routing table promises
        # every one of these skills exists, so a package that quietly shipped
        # one fewer must fail here rather than at the moment an agent is
        # launched.
        - share/wf/skills/wf/SKILL.md
        - share/wf/skills/wf-auto/SKILL.md
        - share/wf/skills/wf-mid/SKILL.md
        - share/wf/skills/wf-one/SKILL.md
        - share/wf/skills/wf-tdd/SKILL.md
        - share/wf/skills/wf-review/SKILL.md
        - share/wf/skills/wf/GITHUB_TRACKER.md
        - share/wf/skills/wf/LIFECYCLE.md

about:
  homepage: https://github.com/blooop/wayfinder
  repository: https://github.com/blooop/wayfinder
  license: MIT
  license_file: LICENSE
  summary: A multi-project wayfinder ticket selector over agentic planning maps
  description: |
    `wf` is a fuzzy-find picker over the wayfinder planning maps of every project
    on the machine. Projects accrete as you use it, and each mapped repo's
    tickets are read live from GitHub Issues via `gh`. Pressing enter on a ticket
    runs an agent on it in that project's checkout by replacing `wf`'s own
    process — the picker draws, you pick, and the agent has the terminal.

extra:
  recipe-maintainers:
    - blooop
