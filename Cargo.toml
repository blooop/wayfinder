[package]
name = "wf"
version = "0.1.1"
edition = "2021"
description = "Multi-project wayfinder manager TUI: fuzzy-find picker and terminal starmap over agentic planning maps"
license = "MIT"
repository = "https://github.com/blooop/wayfinder"

[dependencies]
anyhow = "1"
dirs = "6.0.0"
nucleo-matcher = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
