[package]
name = "wf"
version = "0.4.0"
edition = "2021"
description = "Multi-project wayfinder ticket selector: a fuzzy-find picker over agentic planning maps that runs the agent on the ticket you pick"
license = "MIT"
repository = "https://github.com/blooop/wayfinder"

[dev-dependencies]
# Only the pty end-to-end test needs it: driving the real binary through a real
# terminal is the only way to prove `enter` execs the agent (tests/live_launch_exec.rs).
libc = "0.2"

[dependencies]
anyhow = "1"
dirs = "6.0.0"
nucleo-matcher = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
