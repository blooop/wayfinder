name: CI

# Formatting, lints, tests and docs — everything that can be judged with
# nothing but a compiler and this checkout. Three other workflows cover what
# cannot: `package.yml` proves the recipe still installs and runs,
# `devlaunch-contract.yml` runs `wf` against a real `dl` at three chosen
# versions, and `live.yml` runs the gh-live tests against the real tracker
# after a merge. All four are kept apart on purpose, and for one reason — a rattler
# build and a conda solve each take minutes and download a toolchain of their
# own, so folding `cargo fmt` into either would make the cheapest possible
# failure the slowest one to hear about.
on:
  pull_request:
  push:
    branches: [main]
  # A trigger that can be pulled by hand, because the automatic ones cannot be
  # trusted to have fired. The Actions outage of 2026-08-06 (blooop/wayfinder#79)
  # throttled webhooks to a fraction of deliveries, and three merges to `main`
  # landed with no run at all — a dropped trigger leaves a commit looking clean
  # while nothing ever ran, which is indistinguishable from green unless you go
  # asking. This is how you re-fire one for a ref without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A warning is a failure here and only here. The lint levels themselves live
  # in Cargo.toml's `[lints]` table, at `warn`, so a local `cargo build` stays
  # readable while a pull request cannot merge with a warning in it — one place
  # to change a level, one place that decides how loudly it lands.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  # One job, not four. Every step below needs the same dependency graph
  # compiled, and separate jobs would each pay for it from scratch — the whole
  # run is faster than a single cold `cargo clippy`. The steps are ordered by
  # how cheap they are to fix, so the fastest failure is also the first one:
  # formatting needs no compilation at all, lints need one check pass, tests
  # need a build.
  check:
    name: fmt + clippy + test + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version is named here, and that is the point: rustup reads
      # `rust-toolchain.toml` and installs exactly the channel and the components
      # it names. `dtolnay/rust-toolchain` cannot do that — it selects by `@rev`
      # and has never read that file — so keeping it would mean the compiler
      # version lived in this file too. That is what `@stable` was: a second
      # source of truth that moved on its own, and took `main` red with it on a
      # day nobody committed anything (#173).
      #
      # Any rustup command inside the checkout triggers the install. This one is
      # here so the download is a named step in the log rather than a surprise in
      # the middle of the first cargo command, and so a channel that cannot be
      # fetched fails against a step that says why.
      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup show active-toolchain

      # Keyed on the lockfile and the compiler version, and scoped to this
      # workflow so `package.yml`'s registry cache stays a separate thing.
      - name: Cache cargo's registry and the target directory
        uses: Swatinem/rust-cache@v2
        with:
          key: ci

      # First, because it is the one check that cannot be wrong about the code:
      # it either matches `cargo fmt` or it does not. rustfmt.toml holds only
      # stable options, so this runs on the stable toolchain above rather than
      # needing nightly.
      - name: Formatting
        run: cargo fmt --all --check

      # `--all-targets` reaches the tests, the example and the `#[cfg(test)]`
      # modules — most of this crate's code is in one of those, and a lint that
      # stopped at `src/` would miss it. `--locked` fails on a Cargo.lock that
      # does not match Cargo.toml instead of quietly updating it, which is the
      # same promise the recipe's `--locked` build makes.
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

      # The unit tests, the ones that need nothing but a compiler. The `live_*`
      # integration tests under `tests/` are excluded: most of them want a real
      # `gh`, real network, and assertions against this project's own tracker as
      # it stands today, so running them here would make CI fail whenever the
      # map moves on. `live_devlaunch.rs` is excluded for a different reason —
      # it wants a real `dl` at a chosen version, which is a pixi environment
      # and therefore `devlaunch-contract.yml`'s job, not this one's. All of
      # them are compiled below instead of run.
      - name: Unit tests
        run: cargo test --locked --lib --bins --examples

      # An offline resident of `tests/`: shape checks on the doc snippets
      # agents copy-paste, no network and no `gh` — the seam is the doc text
      # itself. It has to be named here because the step above stops at
      # `--lib --bins --examples`, and an assertion no workflow runs is not
      # an assertion.
      - name: Skill doc shape checks
        run: cargo test --locked --test skill_docs

      # Another config-as-behavior binary, same reasoning: what a workspace
      # boots from and what `devcontainer.yml` publishes are promises split
      # across two devcontainer configs and a workflow, and nothing but this
      # notices when one of them moves. Named here for the same reason as the
      # step above — the unit-test step stops at `--lib --bins --examples`.
      - name: Devcontainer prebuild contract
        run: cargo test --locked --test devcontainer_prebuild

      # The third config-as-behavior binary, and the one that keeps this file
      # honest: the step above that installs the toolchain names no version
      # because `rust-toolchain.toml` is the only place one is written. Nothing
      # at runtime notices when a second place appears — a workflow that installs
      # a toolchain by name still passes every other check here — so the guard
      # has to read the configuration, which is what this does.
      - name: The Rust pin has one home
        run: cargo test --locked --test toolchain_pin

      # The guard on the exclusion every step around it depends on: the live
      # binaries are safe to leave out of the unit-test step only because each
      # of their tests carries `#[ignore]`, and a new one that forgets it is
      # invisible both here and in `live.yml`, which selects with `--ignored`.
      # This walks `tests/live_*.rs` and reads the attributes off the source,
      # which is the only place the omission is visible — running the tests
      # cannot see it, since running them is the symptom.
      - name: The live tests are all gated
        run: cargo test --locked --test offline_green

      # The live fixture's own diagnostic — offline like its three siblings
      # above — which decides what a failing live test tells
      # you about a missing GH_TOKEN. It is split from the environment it reads
      # precisely so it can be asserted — and an assertion no workflow runs is
      # not an assertion. Named by filter, so the live tests around it stay
      # compiled-not-run as below. Quoted because a plain YAML scalar may not
      # end in a colon, and `common::` does — unquoted, this file stops parsing
      # and the whole workflow silently never runs, which is the #84 failure
      # mode rather than a loud one.
      - name: The live fixture's diagnostic
        run: "cargo test --locked --test live_fetch -- common::"

      # Compiled but not run: a test that no longer builds is rot, and this is
      # what catches it at the commit that caused it rather than at the next
      # `live.yml` run after a merge.
      - name: The live tests still compile
        run: cargo test --locked --all-targets --no-run

      # `RUSTDOCFLAGS` above makes this fail on a broken intra-doc link. Worth a
      # step of its own in a crate this heavily documented: the doc comments
      # cross-reference each other constantly, and a link that silently stops
      # resolving is a comment that has started lying about where its subject
      # lives.
      - name: Docs
        run: cargo doc --no-deps --all-features --locked
